name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every module file
        run: python tools/validate_catalog.py

      - name: Check the generator output is committed
        run: |
          python tools/generate_catalog.py
          if ! git diff --quiet; then
            echo "::error::modules/ is out of date with tools/generate_catalog.py."
            echo "Run 'python tools/generate_catalog.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the unit and integration suites
        run: python tools/run_browser_tests.py --keep-going
