<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfboard Studio — design perfboard layouts in the browser</title>
  <meta name="description"
        content="Lay out modules and wiring on a perfboard, flip between component and solder side, and save your design as JSON.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#11141a">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c99b58'/%3E%3Cg fill='%230d1014'%3E%3Ccircle cx='9' cy='9' r='2.4'/%3E%3Ccircle cx='16' cy='9' r='2.4'/%3E%3Ccircle cx='23' cy='9' r='2.4'/%3E%3Ccircle cx='9' cy='16' r='2.4'/%3E%3Ccircle cx='16' cy='16' r='2.4'/%3E%3Ccircle cx='23' cy='16' r='2.4'/%3E%3Ccircle cx='9' cy='23' r='2.4'/%3E%3Ccircle cx='16' cy='23' r='2.4'/%3E%3Ccircle cx='23' cy='23' r='2.4'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <div id="loading" class="pbs-loading">
    <div class="pbs-loading-inner">
      <span class="pbs-logo pbs-logo-lg">▦</span>
      <p>Loading parts catalog…</p>
    </div>
  </div>

  <div id="app" class="pbs-app" hidden>
    <header id="toolbar" class="pbs-toolbar"></header>

    <div class="pbs-body">
      <aside class="pbs-sidebar pbs-sidebar-left">
        <h2 class="pbs-panel-heading">Parts</h2>
        <div id="palette" class="pbs-palette"></div>
      </aside>

      <main class="pbs-canvas">
        <svg id="board" class="pbs-board"
             xmlns="http://www.w3.org/2000/svg"
             role="application"
             aria-label="Perfboard layout. Use the toolbar to pick a tool; press F1 for shortcuts."></svg>
      </main>

      <aside id="inspector" class="pbs-sidebar pbs-sidebar-right"></aside>
    </div>

    <footer id="status" class="pbs-status"></footer>
  </div>

  <noscript>
    <p style="padding:2rem;font:16px system-ui;color:#c0caf5;background:#11141a">
      Perfboard Studio is an interactive editor and needs JavaScript enabled.
    </p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
